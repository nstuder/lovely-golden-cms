- name: deploy lovely-golden
  hosts: servers
  gather_facts: no
  tasks:
      - name: Update Git branch
        ansible.builtin.git:
            repo: git@github.com:nstuder/lovely-golden-cms.git
            dest: /home/nstuder/lovely-golden
            version: main
            update: yes

      # Only rebuild/restart the website. MongoDB keeps running untouched.
      - name: Build and restart website
        community.docker.docker_compose_v2:
            project_src: /home/nstuder/lovely-golden
            services:
                - payload
            dependencies: false
            build: always
            state: present
        register: output
